name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check skills.sh syntax
        run: sh -n scripts/skills.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install probe skills
        run: |
          npx -y --prefer-online skl-x add sentimony/skills -s scope-triage scope-check plan-crafting inline-plan-dev subagent-plan-dev git-worktree-isolation parallel-agents tdd review-request cross-review review-resolution debugging web-debug webapp-debugger verification-gate branch-finish commit-all gh-switch frontend-crafting vitest typescript echarts prose-crafting dashfix negafix maintaining-agent-context secret-hygiene skill-crafting -a codex claude-code -y -m sm
          npx -y --prefer-online skl-x add sentimony/agentic-workflow -s specify plan-craft implement verify cr-request cr-received finalize session-learnings -a codex claude-code -y -m sm

      - name: Check probe skills
        run: |
          for skill in scope-triage scope-check plan-crafting inline-plan-dev subagent-plan-dev git-worktree-isolation parallel-agents tdd review-request cross-review review-resolution debugging web-debug webapp-debugger verification-gate branch-finish commit-all gh-switch frontend-crafting vitest typescript echarts prose-crafting dashfix negafix maintaining-agent-context secret-hygiene skill-crafting specify plan-craft implement verify cr-request cr-received finalize session-learnings; do
            for dir in .claude/skills .agents/skills; do
              if [ ! -f "$dir/$skill/SKILL.md" ]; then
                echo "$dir/$skill/SKILL.md is missing"
                exit 1
              fi
            done
          done

      - name: Remove probe skills
        run: npx -y --prefer-online skl-x rm scope-triage scope-check plan-crafting inline-plan-dev subagent-plan-dev git-worktree-isolation parallel-agents tdd review-request cross-review review-resolution debugging web-debug webapp-debugger verification-gate branch-finish commit-all gh-switch frontend-crafting vitest typescript echarts prose-crafting dashfix negafix maintaining-agent-context secret-hygiene skill-crafting specify plan-craft implement verify cr-request cr-received finalize session-learnings -y -m sm

      # -L catches a dangling symlink that -e misses
      - name: Check probe skills removal
        run: |
          for skill in scope-triage scope-check plan-crafting inline-plan-dev subagent-plan-dev git-worktree-isolation parallel-agents tdd review-request cross-review review-resolution debugging web-debug webapp-debugger verification-gate branch-finish commit-all gh-switch frontend-crafting vitest typescript echarts prose-crafting dashfix negafix maintaining-agent-context secret-hygiene skill-crafting specify plan-craft implement verify cr-request cr-received finalize session-learnings; do
            for dir in .claude/skills .agents/skills; do
              if [ -e "$dir/$skill" ] || [ -L "$dir/$skill" ]; then
                echo "$dir/$skill still exists"
                exit 1
              fi
            done
          done

      - run: npm ci

      - run: npm run typecheck

      - run: npm run typecheck:ts7

      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke-test pages
        run: npm run test:pages
